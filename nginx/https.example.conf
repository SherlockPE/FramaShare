# Include inside Nginx's http block. Replace hostname, certificate and frontend path.
# Backend must bind to loopback. Never expose STORAGE_PATH through a location.
server {
    listen 80;
    server_name framashare.example.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name framashare.example.org;
    ssl_certificate /etc/ssl/framashare/fullchain.pem;
    ssl_certificate_key /etc/ssl/framashare/privkey.pem;
    client_max_body_size 101m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Capability tokens occur in URLs: avoid recording API URLs in access logs.
    location /api/ {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
    location / {
        access_log off;
        root /srv/framashare/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
