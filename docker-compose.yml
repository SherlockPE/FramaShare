services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: miapp_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/miapp_db?schema=public
      PORT: 3000
      HOST: 0.0.0.0
      APP_ORIGIN: http://localhost
      STORAGE_PATH: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
